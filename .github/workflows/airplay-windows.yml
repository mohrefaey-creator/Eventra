name: AirPlay receiver for Windows

# Builds UxPlay (an open-source AirPlay mirroring receiver, https://github.com/FDH2/UxPlay) for Windows and packs it with
# everything it needs into one zip, so an iPhone/iPad can mirror to a Windows laptop with its built-in Screen Mirroring
# button, with no app installed on the phone. Run it from the Actions tab (Run workflow) and download the artifact.

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/airplay-windows.yml", "airplay/**"]

jobs:
  build:
    name: Build UxPlay for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Build UxPlay
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/FDH2/UxPlay uxplay-src
          cd uxplay-src
          git log -1 --format='UxPlay commit %H (%cs): %s'
          grep -m3 -i -E 'project\(|VERSION' CMakeLists.txt || true
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja
          ls -l uxplay.exe

      - name: Pack it with everything it needs
        run: |
          set -euo pipefail
          D="$(cygpath -u "$GITHUB_WORKSPACE")/dist/UxPlay"
          mkdir -p "$D/bin" "$D/lib/gstreamer-1.0" "$D/libexec/gstreamer-1.0"
          cp uxplay-src/build/uxplay.exe "$D/bin/"
          cp /ucrt64/bin/gst-inspect-1.0.exe /ucrt64/bin/gst-launch-1.0.exe "$D/bin/"
          cp /ucrt64/libexec/gstreamer-1.0/gst-plugin-scanner.exe "$D/libexec/gstreamer-1.0/"

          # The GStreamer plugins: every one from the "base" and "good" sets (UxPlay's pipelines use elements from many of
          # them, for example "level" and "videoflip"), minus a few big ones it does not need, plus the H.264 parser,
          # the Windows video/audio outputs and the libav decoders from the "bad" and "libav" sets.
          P=mingw-w64-ucrt-x86_64
          for pkg in gst-plugins-base gst-plugins-good gst-plugins-bad gst-libav gstreamer; do
            pacman -Ql ${P}-${pkg} | awk '{print $2}' | grep -E '/lib/gstreamer-1.0/libgst[^/]*\.dll$' | while read -r f; do
              name="$(basename "$f" .dll)"; name="${name#libgst}"
              case "$pkg" in
                gst-plugins-bad)
                  case "$name" in videoparsersbad|d3d11|d3d12|wasapi|wasapi2|dxva|fdkaac|deinterlace) ;; *) continue ;; esac ;;
                gst-plugins-good)
                  case "$name" in soup|qmlgl|qt*|gtk*|vpx|lame|mpg123|twolame|pulse|jack|shout2|taglib|wavpack|speex|flac|dv|cairo|v4l2|oss*|ximage|aalib|libcaca|jpegformat) continue ;; esac ;;
              esac
              cp "$f" "$D/lib/gstreamer-1.0/" && echo "plugin: $name"
            done
          done
          ls "$D/lib/gstreamer-1.0" | wc -l

          # Every DLL those programs need, found again and again until nothing new turns up.
          LIST="$(mktemp)"
          ls "$D"/bin/*.exe "$D"/lib/gstreamer-1.0/*.dll "$D"/libexec/gstreamer-1.0/*.exe > "$LIST"
          while [ -s "$LIST" ]; do
            NEXT="$(mktemp)"
            while read -r f; do
              ldd "$f" 2>/dev/null | awk '/=> \/ucrt64\// {print $3}' | while read -r dll; do
                base="$(basename "$dll")"
                if [ ! -f "$D/bin/$base" ]; then cp "$dll" "$D/bin/" && echo "$D/bin/$base" >> "$NEXT"; fi
              done
            done < "$LIST"
            mv "$NEXT" "$LIST"
          done
          echo "--- size"; du -sh "$D"; ls "$D/bin" | wc -l

      - name: Add the launch files
        run: |
          set -euo pipefail
          D="$(cygpath -u "$GITHUB_WORKSPACE")/dist/UxPlay"
          cp airplay/Start-AirPlay.bat airplay/Start-AirPlay-Fullscreen.bat airplay/Allow-Firewall.bat airplay/READ-ME.txt "$D/"

      - name: Check it starts from a clean Windows (no MSYS2)
        shell: cmd
        run: |
          set "ROOT=%GITHUB_WORKSPACE%\dist\UxPlay"
          set "PATH=%ROOT%\bin;C:\Windows\System32;C:\Windows"
          set "GST_PLUGIN_SYSTEM_PATH_1_0=%ROOT%\lib\gstreamer-1.0"
          set "GST_PLUGIN_PATH_1_0=%ROOT%\lib\gstreamer-1.0"
          set "GST_PLUGIN_SCANNER=%ROOT%\libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          set "GST_REGISTRY_1_0=%TEMP%\uxplay-check-registry.bin"
          for %%E in (appsrc queue h264parse avdec_h264 decodebin videoconvert videoscale videoflip autovideosink d3d11videosink audioconvert audioresample volume level autoaudiosink wasapisink aacparse avdec_aac avdec_alac jpegdec imagefreeze textoverlay playbin) do (
            gst-inspect-1.0.exe %%E >nul 2>&1 && (echo ok: %%E) || (echo MISSING: %%E)
          )
          gst-inspect-1.0.exe h264parse >nul 2>&1 || exit /b 1
          gst-inspect-1.0.exe avdec_h264 >nul 2>&1 || exit /b 1
          gst-inspect-1.0.exe videoconvert >nul 2>&1 || exit /b 1
          gst-inspect-1.0.exe autovideosink >nul 2>&1 || exit /b 1
          gst-inspect-1.0.exe level >nul 2>&1 || exit /b 1
          gst-inspect-1.0.exe videoflip >nul 2>&1 || exit /b 1
          gst-inspect-1.0.exe avdec_alac >nul 2>&1 || exit /b 1
          uxplay.exe -h | findstr /i "uxplay"

      - name: Start the receiver for a few seconds and fail if it reports any error
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "dist\UxPlay"
          $env:PATH = "$root\bin;C:\Windows\System32;C:\Windows"
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = "$root\lib\gstreamer-1.0"
          $env:GST_PLUGIN_PATH_1_0 = "$root\lib\gstreamer-1.0"
          $env:GST_PLUGIN_SCANNER = "$root\libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          $env:GST_REGISTRY_1_0 = Join-Path $env:TEMP "uxplay-run-registry.bin"
          $out = Join-Path $env:TEMP "uxplay-out.txt"; $err = Join-Path $env:TEMP "uxplay-err.txt"
          $p = Start-Process -FilePath "$root\bin\uxplay.exe" -ArgumentList "-n","CI-Check","-nh" `
               -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          $stillRunning = -not $p.HasExited
          if ($stillRunning) { Stop-Process -Id $p.Id -Force }
          "---- output"; Get-Content $out, $err
          if (-not $stillRunning) { Write-Error "The receiver stopped by itself (exit code $($p.ExitCode))"; exit 1 }
          if (Select-String -Path $out, $err -Pattern "ERROR|no element|CRITICAL|could not|failed" -Quiet) {
            Write-Error "The receiver printed an error"; exit 1
          }

      - name: Zip
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/dist"
          zip -qr ../MirrorLink-AirPlay-Receiver-Windows.zip UxPlay
          ls -lh ../MirrorLink-AirPlay-Receiver-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorLink-AirPlay-Receiver-Windows
          path: MirrorLink-AirPlay-Receiver-Windows.zip
          if-no-files-found: error
